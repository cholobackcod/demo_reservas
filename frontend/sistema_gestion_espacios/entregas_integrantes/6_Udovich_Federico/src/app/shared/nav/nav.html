<header class="bg-white py-2 shadow-sm border-top border-info border-4 sticky-top">
  <nav class="navbar navbar-expand-md navbar-light bg-white py-1">
    <div class="container">

      <a class="navbar-brand d-flex align-items-center me-auto" routerLink="/">
        <img src="/images/logo.png" alt="Logo" class="me-2" style="width: 40px; height: 40px;">
        <span class="fs-5 fw-black tracking-tight">
          <span class="text-dark fw-bold">Escuela ProA</span>
          <span class="text-info fw-bold ms-1">Sede Capital Norte</span>
        </span>
      </a>

      <button class="navbar-toggler border-0 shadow-none ms-2" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse mt-3 mt-md-0" id="navbarContent">
        <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">

          <li class="nav-item">
            <a class="nav-link text-secondary fw-semibold px-3 rounded-pill hover-bg-light" routerLink="/about"
              routerLinkActive="active text-info fw-bold">
              Quiénes Somos
            </a>
          </li>

          @if (currentUser) {
            <li class="nav-item">
              <a
                class="nav-link text-secondary fw-semibold px-3 rounded-pill hover-bg-light"
                [routerLink]="currentUser.rol === 'admin' ? '/dashboard/admin' : '/dashboard/user'"
                routerLinkActive="active text-info fw-bold"
              >
                <i class="bi bi-speedometer2 me-1"></i> Panel ({{ currentUser.rol | titlecase }})
              </a>
            </li>

            <li class="nav-item d-flex align-items-center ms-md-2 mt-2 mt-md-0">
              <span class="text-muted small me-3 fw-semibold">
                Hola, {{ currentUser.nombre }}
              </span>
              <button
                class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-semibold"
                (click)="logout()"
              >
                <i class="bi bi-box-arrow-right me-1"></i> Salir
              </button>
            </li>
          } @else {
            <li class="nav-item mt-2 mt-md-0">
              <a class="btn btn-outline-info rounded-pill px-4 fw-semibold d-inline-flex align-items-center shadow-sm"
                routerLink="/login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
              </a>
            </li>
          }

        </ul>
      </div>

    </div>
  </nav>
</header>
